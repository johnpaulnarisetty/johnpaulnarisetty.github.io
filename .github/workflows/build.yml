name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A1C903: ${{ secrets.A1C903 }}
          B8A461: ${{ secrets.B8A461 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A1C903', '')
          sec_b = os.environ.get('B8A461', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- c2a215e6aacaa5348df168acbbcf789a1cec -->', sec_a)
          if sec_b:
              after = after.replace('<!-- c0e0b1c6027ba118b0ddad52967c19c81573c1d878 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5c1226">
<title>Prova Cega de Vinhos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --claret: #7b1830;
    --claret-deep: #5c1226;
    --blush: #f7eef0;
    --blush-strong: #efdde1;
    --bottle: #1f4d3a;
    --bottle-soft: #e3efe8;
    --ink: #1e1418;
    --muted: #5f4f54;
    --line: #e2d3d7;
    --paper: #ffffff;
    --alert: #a3202b;
    --alert-soft: #fbe6e7;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { font-size: 20px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--blush); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 16px 64px; }
  h1 { font-size: 1.8rem; line-height: 1.15; margin: .5em 0 .35em; color: var(--claret-deep); }
  h2 { font-size: 1.2rem; line-height: 1.25; margin: 0 0 .5em; }
  p { margin: .4em 0; }
  .center { text-align: center; }
  .lead { font-size: 1.1rem; color: var(--muted); }
  .small { font-size: .85rem; color: var(--muted); }

  .card { background: var(--paper); border-radius: 20px; padding: 18px; margin: 14px 0; border: 1px solid var(--line); }
  .card.host { border: 3px solid var(--bottle); }
  .ribbon { background: #fff6e0; border: 2px solid #c99a2e; color: #6b4e0e; border-radius: 12px; padding: 6px 12px; text-align: center; font-weight: 700; font-size: .85rem; margin-bottom: 10px; }

  label, .label { display: block; font-weight: 700; margin: 16px 0 6px; }
  input, select {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 14px; color: var(--ink);
    border: 2px solid #cdb9be; border-radius: 12px; background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: var(--claret); box-shadow: 0 0 0 4px var(--blush-strong); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--claret); outline-offset: 3px; }

  .btn { display: block; width: 100%; min-height: 62px; margin-top: 16px; padding: 14px 18px; border-radius: 14px; border: 2px solid transparent; font-size: 1.1rem; font-weight: 700; }
  .btn.primary { background: var(--claret); color: #fff; }
  .btn.green { background: var(--bottle); color: #fff; }
  .btn.outline { background: #fff; color: var(--claret); border-color: var(--claret); }
  .btn:disabled { opacity: .4; cursor: default; }
  .textbtn { display: block; margin: 12px auto 0; background: none; border: none; color: var(--claret); text-decoration: underline; font-size: .95rem; padding: 10px; min-height: 44px; }
  .smallbtn { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-size: .85rem; min-height: 44px; flex: none; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; }
  .top b { color: var(--claret); letter-spacing: .08em; }

  .brand { text-align: center; padding: 28px 0 4px; }
  .brand .glass, .stage .bigicon { font-size: 3.4rem; line-height: 1; }
  .stage { text-align: center; padding: 18px 0 0; }

  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: none; }
  .sub { display: block; color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); font-style: italic; }

  .wine-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .wine-item .acts { display: flex; gap: 8px; margin-top: 6px; }
  .share-box { background: var(--blush); border-radius: 14px; padding: 12px; margin-top: 10px; }
  .add-form { margin-top: 8px; }

  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .pill { min-height: 52px; padding: 10px 18px; border-radius: 99px; border: 2px solid #cdb9be; background: #fff; color: var(--ink); font-size: 1rem; font-weight: 700; }
  .pill.on { background: var(--claret); border-color: var(--claret); color: #fff; }
  .pill.on::before { content: "✓ "; }

  .steps { padding-left: 1.4em; margin: .6em 0; }
  .steps li { margin: .5em 0; }

  .waiting { text-align: center; padding: 20px; border-radius: 16px; background: var(--blush-strong); color: var(--claret-deep); font-weight: 700; font-size: 1.1rem; margin: 14px 0; }
  .waiting .small { font-weight: 400; }

  #qr { display: flex; justify-content: center; padding: 8px; background: #fff; }
  #qr img, #qr canvas { max-width: 100%; height: auto; }
  .bigcode { display: block; text-align: center; font-size: 2.4rem; font-weight: 700; letter-spacing: .25em; color: var(--claret); margin: 4px 0; }

  /* The bottle label with arrows: the one bold element */
  .label-wrap { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 14px 0 10px; }
  .arrow { flex: none; width: 56px; height: 72px; border-radius: 14px; border: 2px solid var(--claret); background: #fff; color: var(--claret); font-size: 1.8rem; font-weight: 700; }
  .arrow:disabled { opacity: .25; cursor: default; }
  .bottle-label {
    width: min(220px, 52vw); padding: 14px 10px 12px; text-align: center; background: #fff;
    border: 3px solid var(--claret); border-radius: 50% / 38%;
    box-shadow: inset 0 0 0 6px #fff, inset 0 0 0 8px var(--claret);
  }
  .bottle-label .cap { font-size: .9rem; color: var(--muted); }
  .bottle-label .num { font-size: 4rem; font-weight: 700; line-height: 1; color: var(--claret-deep); }
  .bottle-label .of { font-size: .9rem; color: var(--muted); }

  .prompt { text-align: center; font-size: 1.15rem; font-weight: 700; margin: 8px 0; }
  .saved { text-align: center; padding: 10px; border-radius: 12px; background: var(--bottle-soft); color: var(--bottle); font-weight: 700; margin: 8px 0; }
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .score {
    min-height: 80px; border-radius: 16px; border: 2px solid #cdb9be; background: #fff; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px;
  }
  .score .n { font-size: 2.1rem; font-weight: 700; line-height: 1; }
  .score .left { font-size: .8rem; color: var(--muted); margin-top: 5px; }
  .score.sel { background: var(--claret); border-color: var(--claret); color: #fff; }
  .score.sel .left { color: #fff; }
  .score:disabled { background: #efe9ea; color: #ad9fa3; border-style: dashed; cursor: default; }
  .score:disabled .left { color: #ad9fa3; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-width: 62px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: #fff; display: flex; flex-direction: column; align-items: center; font-size: .8rem; color: var(--muted); }
  .chip b { font-size: 1.3rem; color: var(--ink); }
  .chip.todo { border-style: dashed; }
  .chip.active { border-color: var(--claret); box-shadow: 0 0 0 2px var(--claret); }

  .tag-num { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--claret); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.4rem; color: var(--claret-deep); background: #fff; }
  .reveal-row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; }
  .reveal-row .rv { flex: 1; min-width: 0; }
  .reveal-row .sub { margin: 4px 0 0 4px; }
  .majority { color: var(--bottle); font-weight: 700; }

  .winner { text-align: center; background: var(--claret-deep); color: #fff; border-radius: 24px; padding: 24px 18px; margin: 14px 0; }
  .winner .medal { font-size: 3.2rem; line-height: 1; }
  .winner .wname { font-size: 1.8rem; font-weight: 700; line-height: 1.15; margin: 10px 0 4px; }
  .winner .avg { font-size: 2.8rem; font-weight: 700; margin-top: 10px; line-height: 1; }
  .winner .soft { opacity: .85; font-size: .9rem; }
  .reveal { animation: pop .7s ease-out both; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

  details.rank { border-bottom: 1px solid var(--line); }
  details.rank:last-child { border-bottom: none; }
  details.rank summary { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; list-style: none; }
  details.rank summary::-webkit-details-marker { display: none; }
  .rk { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--blush-strong); color: var(--claret-deep); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; }
  .rk.medal { background: none; font-size: 2rem; }
  .rank .info { flex: 1; min-width: 0; }
  .rank .av { font-size: 1.4rem; font-weight: 700; color: var(--claret-deep); }
  .rank .more { padding: 0 4px 14px 56px; }
  .mine-tag { display: inline-block; background: var(--bottle-soft); color: var(--bottle); font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; margin-left: 4px; vertical-align: middle; }
  .nrow { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 1rem; }
  .nrow b { color: var(--claret-deep); }
  .facts { background: var(--blush); border-radius: 10px; padding: 8px 10px; margin: 4px 0 8px; font-size: .9rem; }
  .ok { color: var(--bottle); font-weight: 700; }
  .bad { color: var(--alert); }

  #toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%);
    width: min(520px, calc(100% - 28px)); padding: 16px 18px; border-radius: 14px; font-weight: 700; font-size: 1.05rem;
    background: var(--alert); color: #fff; box-shadow: 0 8px 28px rgba(40, 10, 20, .3); transition: transform .25s ease; z-index: 10; text-align: center;
  }
  #toast.ok { background: var(--bottle); }
  #toast.show { transform: translate(-50%, 0); }
  #toast:not(.show) { visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }

  /* In-app dialog (replaces the browser's "site says..." boxes) */
  #modal { position: fixed; inset: 0; background: rgba(30, 10, 18, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 16px; }
  #modal[hidden] { display: none; }
  #modal .sheet { background: #fff; border-radius: 22px; padding: 22px 18px 18px; width: min(520px, 100%); max-height: 85vh; overflow: auto; font-size: 1.1rem; }
  #modal .sheet ul { padding-left: 1.2em; margin: .5em 0; }
  #modal .btns { display: flex; gap: 12px; }
  #modal .btns .btn { flex: 1; }
</style>
</head>
<body>
<div id="app"><p class="center lead" style="margin-top:40vh">A carregar…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mText">
  <div id="mText"></div>
  <div class="btns"><button class="btn outline" id="mNo">Cancelar</button><button class="btn primary" id="mYes">Sim</button></div>
</div></div>

<datalist id="dl-country">
  <option>Portugal</option><option>Espanha</option><option>França</option><option>Itália</option><option>Alemanha</option>
  <option>Áustria</option><option>Grécia</option><option>Argentina</option><option>Chile</option><option>Brasil</option>
  <option>Uruguai</option><option>Estados Unidos</option><option>África do Sul</option><option>Austrália</option><option>Nova Zelândia</option>
</datalist>
<datalist id="dl-region">
  <option>Douro</option><option>Porto</option><option>Vinho Verde</option><option>Trás-os-Montes</option><option>Dão</option>
  <option>Bairrada</option><option>Beira Interior</option><option>Távora-Varosa</option><option>Lisboa</option><option>Tejo</option>
  <option>Península de Setúbal</option><option>Alentejo</option><option>Algarve</option><option>Madeira</option><option>Açores</option>
  <option>Colares</option><option>Bucelas</option><option>Rioja</option><option>Ribera del Duero</option><option>Rías Baixas</option>
  <option>Priorat</option><option>Bordéus</option><option>Borgonha</option><option>Champagne</option><option>Ródano</option>
  <option>Loire</option><option>Toscana</option><option>Piemonte</option><option>Mendoza</option>
</datalist>
<datalist id="dl-grape">
  <option>Touriga Nacional</option><option>Touriga Franca</option><option>Tinta Roriz</option><option>Aragonez</option><option>Tinta Barroca</option>
  <option>Tinto Cão</option><option>Sousão</option><option>Baga</option><option>Castelão</option><option>Trincadeira</option>
  <option>Alicante Bouschet</option><option>Jaen</option><option>Alfrocheiro</option><option>Tinta Miúda</option><option>Syrah</option>
  <option>Cabernet Sauvignon</option><option>Merlot</option><option>Pinot Noir</option><option>Tempranillo</option><option>Alvarinho</option>
  <option>Loureiro</option><option>Avesso</option><option>Arinto</option><option>Encruzado</option><option>Antão Vaz</option>
  <option>Fernão Pires</option><option>Bical</option><option>Maria Gomes</option><option>Verdelho</option><option>Gouveio</option>
  <option>Viosinho</option><option>Rabigato</option><option>Malvasia Fina</option><option>Moscatel</option><option>Chardonnay</option>
  <option>Sauvignon Blanc</option><option>Sercial</option>
</datalist>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Firebase settings for the "prova-vinhos" project */
const firebaseConfig = {
  apiKey: "AIzaSyB6nrk86BwFaabgN4bET2LJ2pSsdqzcG9U",
  authDomain: "prova-vinhos.firebaseapp.com",
  projectId: "prova-vinhos",
  storageBucket: "prova-vinhos.firebasestorage.app",
  messagingSenderId: "812350894582",
  appId: "1:812350894582:web:64ad0c5295e6b1615257d7"
};

/* Phases of a tasting:
   setup   -> everyone joins and registers the bottles they brought (a bottle can belong to several people)
   prep    -> list is closed; wines go into identical bottles, which are shuffled and numbered by hand
   tasting -> everyone scores any bottle, in any order, and may guess its details; ends when everyone scored everything
   reveal  -> everyone says which wine was in each numbered bottle; the majority decides
   done    -> everyone sees the results

   Data: events/{code} with subcollections guests, wines and ratings.
   ratings/{guestId} = { scores: {n: 0-10}, guesses: {n: {...}}, reveal: {n: wineId} } */

const MAX_SCORE = 10;   // scores go from 0 to 10
const PER_SCORE = 2;    // each score can be given at most twice
const MAX_WINES = 20;   // 11 scores x 2 = 22, enough for 20 bottles

/* Only phones that opened the host link (?anfitriao=...) can create tastings.
   This is the SHA-256 of that secret, so the secret itself is not in the page. */
/* Bump APP_VERSION and write the same text in version.txt on every change, so phones pick up the new page. */
const APP_VERSION = '2026-10-12.3';

const HOST_HASH = '49214f3a6d9f8fdf74917bea9434172be1b120fa94d96739f5c2c57320a5e5dd';

const PARAMS = new URLSearchParams(location.search);
const DEMO = PARAMS.has('demo');

const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
let fs = null;

const S = {
  view: 'home', joinCode: null, canCreate: false, hostKey: null,
  code: null, guestId: null, hostPin: null, isHost: false,
  event: null, guests: [], wines: [], ratings: {}, guesses: {}, reveals: {}, guestsLoaded: false,
  sel: null, showGuess: false, showMore: false, shareEdit: null, pending: false, unsub: [],
  lastKey: null, clearDraft: false
};

/* ---------- small helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const fmt = v => v == null ? '–' : v.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const listPt = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
const SKEY = 'blindWineTasting.v2';
const SESSION_DAYS = 2; // a saved tasting is only reopened for a couple of days
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SKEY));
    return s && s.savedAt && Date.now() - s.savedAt < SESSION_DAYS * 864e5 ? s : null;
  } catch (e) { return null; }
}
function saveSession() { if (DEMO) return; try { localStorage.setItem(SKEY, JSON.stringify({ code: S.code, guestId: S.guestId, hostPin: S.hostPin, savedAt: Date.now() })); } catch (e) {} }
function clearSession() { if (DEMO) return; try { localStorage.removeItem(SKEY); } catch (e) {} }
// The address always says which tasting this phone is in; the host link keeps its key, so a reload stays a host link.
function setUrl(code) {
  if (DEMO) return;
  const q = new URLSearchParams();
  if (code) q.set('e', code);
  if (S.hostKey) q.set('anfitriao', S.hostKey);
  try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); } catch (e) {}
}
const evRef = () => fs.collection('events').doc(S.code);
const wineRef = id => evRef().collection('wines').doc(id);
const myRatingRef = () => evRef().collection('ratings').doc(S.guestId);
const guestName = id => { const g = S.guests.find(x => x.id === id); return g ? g.name : 'alguém que saiu'; };
const activeGuests = () => S.guests.filter(g => !g.left);
const myScores = () => S.ratings[S.guestId] || {};
const owners = w => Array.isArray(w.guestIds) && w.guestIds.length ? w.guestIds : (w.guestId ? [w.guestId] : []);
const owns = (w, id) => owners(w).indexOf(id) >= 0;
const broughtBy = w => listPt(owners(w).map(guestName));
const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
const maxScore = () => (S.event && S.event.maxScore) || MAX_SCORE;
const perScore = () => (S.event && S.event.perScore) || PER_SCORE;

let toastTimer = null;
function toast(text, kind) {
  $toast.textContent = text;
  $toast.className = 'show' + (kind === 'ok' ? ' ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $toast.className = kind === 'ok' ? 'ok' : ''; }, 4000);
}

/* In-app dialog. ask() resolves true/false; tell() only has an OK button. */
const $modal = document.getElementById('modal');
function ask(html, yes, no) {
  return new Promise(resolve => {
    document.getElementById('mText').innerHTML = html;
    const bYes = document.getElementById('mYes'), bNo = document.getElementById('mNo');
    bYes.textContent = yes || 'Sim';
    bNo.textContent = no || 'Cancelar';
    bNo.style.display = no === null ? 'none' : '';
    const done = v => { $modal.hidden = true; bYes.onclick = bNo.onclick = null; resolve(v); };
    bYes.onclick = () => done(true);
    bNo.onclick = () => done(false);
    $modal.hidden = false;
    bYes.focus();
  });
}
const tell = html => ask(html, 'OK', null);

function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // no I or O, easy to read
  let c = ''; for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}

/* ---------- wine details and guesses ---------- */
const FIELDS = [
  { k: 'name', label: 'Nome' },
  { k: 'country', label: 'País', list: 'dl-country' },
  { k: 'region', label: 'Região', list: 'dl-region' },
  { k: 'year', label: 'Ano', mode: 'numeric', half: true },
  { k: 'abv', label: 'Teor alcoólico (%)', mode: 'decimal', half: true },
  { k: 'grapes', label: 'Castas', list: 'dl-grape', hint: 'ex.: Touriga Nacional, Tinta Roriz' }
];
const DETAIL_FIELDS = FIELDS.filter(f => f.k !== 'name');
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9.,]+/g, ' ').trim();
const textHit = (g, r) => { g = norm(g); r = norm(r); return !!g && !!r && (g === r || (g.length >= 3 && r.indexOf(g) >= 0) || (r.length >= 3 && g.indexOf(r) >= 0)); };
const splitGrapes = s => String(s || '').split(/[,;/+]|\se\s/i).map(x => x.trim()).filter(Boolean);
const toNum = s => { const v = parseFloat(String(s == null ? '' : s).replace(',', '.')); return isNaN(v) ? null : v; };
const factsLine = w => [w.country, w.region, w.year, w.abv ? String(w.abv).replace('.', ',') + '%' : '', w.grapes].filter(Boolean).join(' · ');

// null when there is nothing to compare; otherwise { ok, note }
function judge(k, guess, wine) {
  const real = wine[k];
  if (guess == null || !String(guess).trim() || real == null || !String(real).trim()) return null;
  if (k === 'year') return { ok: parseInt(guess, 10) === parseInt(real, 10) };
  if (k === 'abv') { const a = toNum(guess), b = toNum(real); return { ok: a != null && b != null && Math.abs(a - b) <= 0.5 }; }
  if (k === 'grapes') {
    const realList = splitGrapes(real), hits = splitGrapes(guess).filter(g => realList.some(r => textHit(g, r))).length;
    return { ok: hits > 0, note: hits + ' de ' + realList.length };
  }
  return { ok: textHit(guess, real) };
}

/* Keep the screen on while the tasting is running, so nobody has to unlock the phone every time. */
let wakeLock = null, wakeBusy = false;
async function syncWakeLock() {
  if (!('wakeLock' in navigator) || wakeBusy) return;
  const want = !!(S.event && ['prep', 'tasting', 'reveal'].indexOf(S.event.phase) >= 0) && document.visibilityState === 'visible';
  wakeBusy = true;
  try {
    if (want && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch (e) {} finally { wakeBusy = false; }
}
document.addEventListener('visibilitychange', syncWakeLock);

/* A phone whose screen went off may come back with a dead connection, and Firestore can wait half a minute
   before retrying. When the screen comes back, reconnect at once. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || DEMO || !fs || !fs.disableNetwork) return;
  fs.disableNetwork().then(() => fs.enableNetwork()).catch(() => {});
});

/* ---------- live data ---------- */
function stopEvent() {
  S.unsub.forEach(u => { try { u(); } catch (e) {} });
  Object.assign(S, { unsub: [], code: null, guestId: null, hostPin: null, isHost: false, event: null, guests: [], wines: [], ratings: {}, guesses: {}, reveals: {}, guestsLoaded: false, sel: null, showGuess: false, showMore: false, shareEdit: null });
  clearSession();
  syncWakeLock();
}

function subscribe() {
  const ev = evRef();
  const onErr = err => { console.error(err); toast('Problema de ligação. Verifique a internet e recarregue a página.'); };
  S.unsub.push(ev.onSnapshot(snap => {
    if (!snap.exists) { stopEvent(); setUrl(null); S.view = 'home'; toast('Esta prova já não existe.'); render(true); return; }
    const prev = S.event;
    S.event = snap.data();
    S.isHost = !!(S.hostPin && S.event.hostPin === S.hostPin);
    const moved = prev && prev.phase !== S.event.phase;
    if (moved) {
      S.shareEdit = null; S.showGuess = false; S.sel = null;
      const ph = S.event.phase;
      if (ph === 'tasting' && prev.phase === 'prep') { toast('A prova começou!', 'ok'); buzz([80, 80, 80]); }
      else if (ph === 'reveal') buzz([80, 80, 80]);
      else if (ph === 'done') buzz([150, 80, 150]);
    }
    render();
    if (moved) window.scrollTo(0, 0);
  }, onErr));
  S.unsub.push(ev.collection('guests').onSnapshot(q => {
    S.guests = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    S.guestsLoaded = true;
    if (S.guestId && !S.guests.some(g => g.id === S.guestId)) {
      const code = S.code; stopEvent(); S.joinCode = code; S.view = 'join'; setUrl(code);
      toast('Escreva o seu nome para voltar a entrar.'); render(true); return;
    }
    render();
  }, onErr));
  S.unsub.push(ev.collection('wines').onSnapshot(q => {
    S.wines = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.number || 0) - (b.number || 0) || (a.createdAt || 0) - (b.createdAt || 0));
    render();
  }, onErr));
  S.unsub.push(ev.collection('ratings').onSnapshot(q => {
    const r = {}, g = {}, v = {};
    q.docs.forEach(d => { const x = d.data(); r[d.id] = x.scores || {}; g[d.id] = x.guesses || {}; v[d.id] = x.reveal || {}; });
    S.ratings = r; S.guesses = g; S.reveals = v; render();
  }, onErr));
}

async function findOrCreateGuest(code, name) {
  const gc = fs.collection('events').doc(code).collection('guests');
  const snap = await gc.get();
  const same = snap.docs.find(d => (d.data().name || '').trim().toLowerCase() === name.toLowerCase());
  if (same) { // same name = same person coming back
    if (same.data().left) await gc.doc(same.id).update({ left: false });
    return same.id;
  }
  const ref = await gc.add({ name, joinedAt: Date.now() });
  return ref.id;
}

function enterEvent(code, guestId, pin) {
  S.code = code; S.guestId = guestId; S.hostPin = pin || null;
  saveSession(); setUrl(code); subscribe(); render(true);
}

async function newEvent(code, name) {
  const ev = fs.collection('events').doc(code);
  const g = ev.collection('guests').doc();
  const pin = String(Math.floor(1000 + Math.random() * 9000));
  await ev.set({ createdAt: Date.now(), hostPin: pin, hostGuest: g.id, phase: 'setup', current: 0, total: 0, maxScore: MAX_SCORE, perScore: PER_SCORE });
  await g.set({ name, joinedAt: Date.now() });
  return { gid: g.id, pin };
}

/* Who has not scored what yet (only people still at the table). */
function missingVotes() {
  const total = S.event.total, out = [];
  activeGuests().forEach(g => {
    const sc = S.ratings[g.id] || {}, miss = [];
    for (let k = 1; k <= total; k++) if (sc[k] == null) miss.push(k);
    if (miss.length) out.push({ g, miss });
  });
  return out;
}

/* Reveal by majority: count every person's "bottle k is wine X" votes and give each bottle the most-voted
   wine that is still free. Ties go to the host's vote, then to the order the wines were registered. */
function majority() {
  const tally = {}, order = {};
  S.wines.forEach((w, i) => { order[w.id] = i; });
  Object.keys(S.reveals).forEach(gid => {
    const map = S.reveals[gid] || {};
    Object.keys(map).forEach(k => {
      const wid = map[k];
      if (!wid || order[wid] == null) return;
      const key = k + '|' + wid;
      const t = tally[key] || (tally[key] = { k: +k, wid, n: 0, host: 0 });
      t.n++; if (S.event.hostGuest && gid === S.event.hostGuest) t.host = 1;
    });
  });
  const byBottle = {}, used = {};
  Object.values(tally).sort((a, b) => b.n - a.n || b.host - a.host || order[a.wid] - order[b.wid]).forEach(t => {
    if (t.k > S.event.total || byBottle[t.k] || used[t.wid]) return;
    byBottle[t.k] = t; used[t.wid] = true;
  });
  return byBottle;
}
function bottlesWithoutMajority() {
  const m = majority(), left = [];
  for (let k = 1; k <= S.event.total; k++) if (!m[k]) left.push(k);
  return left;
}

function firstUnscored() {
  const mine = myScores();
  for (let k = 1; k <= S.event.total; k++) if (mine[k] == null) return k;
  return 1;
}

/* ---------- actions (buttons) ---------- */
const A = {
  home() { S.view = 'home'; render(true); },
  goCreate() { S.view = 'create'; render(true); },
  goHostLogin() { S.view = 'hostLogin'; render(true); },

  goJoin() {

  },

  async join() {
    const name = val('name');
    if (!name) return toast('Escreva o seu nome.');
    const code = S.joinCode;
    const ev = await fs.collection('events').doc(code).get();
    if (!ev.exists) { S.view = 'home'; setUrl(null); render(true); return toast('Não existe nenhuma prova com o código ' + code + '.'); }
    const gid = await findOrCreateGuest(code, name);
    const old = loadSession();
    const pin = old && old.code === code ? old.hostPin : null;
    enterEvent(code, gid, pin);
  },

  async create() {
    if (!S.canCreate) return toast('Só o anfitrião pode criar provas.');
    const name = val('name');
    if (!name) return toast('Escreva o seu nome.');
    let code = null;
    for (let i = 0; i < 10; i++) {
      const c = randCode();
      const s = await fs.collection('events').doc(c).get();
      if (!s.exists) { code = c; break; }
    }
    if (!code) return toast('Não foi possível criar a prova. Tente novamente.');
    const r = await newEvent(code, name);
    enterEvent(code, r.gid, r.pin);
  },

  async hostLogin() {
    const code = val('code').toUpperCase().replace(/[^A-Z]/g, '');
    const pin = val('pin'), name = val('name');
    if (code.length !== 4 || !pin || !name) return toast('Preencha os três campos.');
    const ev = await fs.collection('events').doc(code).get();
    if (!ev.exists) return toast('Não existe nenhuma prova com o código ' + code + '.');
    if (ev.data().hostPin !== pin) return toast('O PIN do anfitrião não está correto.');
    const gid = await findOrCreateGuest(code, name);
    enterEvent(code, gid, pin);
  },


  pill(d, el) {
    const on = !el.classList.contains('on');
    el.classList.toggle('on', on); el.setAttribute('aria-pressed', on);
  },
  toggleMore() { S.showMore = !S.showMore; render(true); },

  async addWine() {
    if (S.wines.length >= MAX_WINES) return toast('Já há ' + MAX_WINES + ' garrafas, o máximo.');
    const name = val('wName');
    if (!name) return toast('Escreva o nome do vinho.');
    const picked = Array.from(document.querySelectorAll('#newOwners .pill.on')).map(b => b.dataset.gid);
    const ids = S.isHost ? picked : [S.guestId].concat(picked.filter(g => g !== S.guestId));
    if (!ids.length) return toast('Toque no nome de quem trouxe esta garrafa.');
    const wine = { guestId: ids[0], guestIds: ids, name, number: null, createdAt: Date.now() };
    DETAIL_FIELDS.forEach(f => { wine[f.k] = val('w_' + f.k); });
    wine.year = wine.year.replace(/\D/g, '').slice(0, 4);
    await evRef().collection('wines').add(wine);
    S.clearDraft = true; S.showMore = false; render(true);
    toast(ids.length === 1 && ids[0] === S.guestId ? 'Garrafa registada.' : 'Garrafa de ' + listPt(ids.map(guestName)) + ' registada.', 'ok');
  },

  async delWine(d) {
    const w = S.wines.find(x => x.id === d.id);
    if (!w || !await ask('Remover a garrafa <b>' + esc(w.name) + '</b>?', 'Remover')) return;
    if (S.shareEdit === d.id) S.shareEdit = null;
    await wineRef(d.id).delete();
  },

  editOwners(d) { S.shareEdit = S.shareEdit === d.id ? null : d.id; render(true); },

  async toggleOwner(d) {
    const w = S.wines.find(x => x.id === d.id);
    if (!w) return;
    let ids = owners(w).slice();
    if (ids.indexOf(d.gid) >= 0) {
      if (ids.length === 1) return toast('A garrafa tem de ficar com pelo menos uma pessoa.');
      ids = ids.filter(x => x !== d.gid);
    } else ids.push(d.gid);
    if (!S.isHost && ids.indexOf(S.guestId) < 0) S.shareEdit = null;
    await wineRef(w.id).update({ guestIds: ids, guestId: ids[0] });
  },

  async delGuest(d) {
    if (!await ask('Remover <b>' + esc(guestName(d.id)) + '</b> da prova?<br><br>As garrafas que só esta pessoa trouxe também saem da lista.', 'Remover')) return;
    const b = fs.batch();
    b.delete(evRef().collection('guests').doc(d.id));
    b.delete(evRef().collection('ratings').doc(d.id));
    S.wines.filter(w => owns(w, d.id)).forEach(w => {
      const rest = owners(w).filter(x => x !== d.id);
      if (rest.length) b.update(wineRef(w.id), { guestIds: rest, guestId: rest[0] });
      else b.delete(wineRef(w.id));
    });
    await b.commit();
  },

  // During the tasting someone who went home can be taken out of the "still missing" list.
  async markLeft(d) {
    if (!await ask('<b>' + esc(guestName(d.id)) + '</b> já saiu?<br><br>Deixa de ser preciso esperar pelas notas desta pessoa. As notas que já deu continuam a contar.', 'Sim, já saiu')) return;
    await evRef().collection('guests').doc(d.id).update({ left: true });
  },

  async closeList() {
    const n = S.wines.length;
    if (n < 2) return toast('São precisas pelo menos 2 garrafas.');
    if (!await ask('Fechar a lista com <b>' + n + ' garrafas</b>?<br><br>Depois já não se podem registar garrafas.', 'Fechar a lista')) return;
    const b = fs.batch();
    S.wines.forEach(w => b.update(wineRef(w.id), { number: null }));
    b.update(evRef(), { phase: 'prep', current: 0, total: n, maxScore: MAX_SCORE, perScore: PER_SCORE });
    await b.commit();
  },

  async backToSetup() {
    if (!await ask('Voltar à lista de garrafas, para acrescentar ou corrigir?', 'Voltar')) return;
    await evRef().update({ phase: 'setup' });
  },

  async beginTasting() {
    if (!await ask('As <b>' + S.event.total + ' garrafas</b> estão numeradas?<br><br>Todos passam a poder votar.', 'Começar')) return;
    await evRef().update({ phase: 'tasting', startedAt: Date.now() });
  },

  go(d) {
    const n = parseInt(d.n, 10);
    if (n >= 1 && n <= S.event.total) { S.sel = n; render(true); }
  },
  toggleGuess() { S.showGuess = !S.showGuess; render(true); },

  async score(d) {
    const n = S.sel;
    const s = parseInt(d.s, 10);
    const mine = myScores();
    const usedElsewhere = Object.keys(mine).filter(k => +k !== n && mine[k] === s).length;
    if (usedElsewhere >= perScore()) return toast('Já deu ' + s + ' a ' + perScore() + ' vinhos.');
    buzz(25);
    S.ratings[S.guestId] = Object.assign({}, mine, { [n]: s });
    render(true);
    // Not awaited: Firestore keeps the score on the phone and sends it in the background,
    // so a slow connection never blocks the next tap.
    myRatingRef().set({ scores: { [n]: s } }, { merge: true })
      .catch(err => { console.error(err); toast('A nota não foi guardada. Verifique a internet e toque outra vez.'); });
    const me = S.guests.find(g => g.id === S.guestId);
    if (me && me.left) evRef().collection('guests').doc(S.guestId).update({ left: false }).catch(() => {});
  },

  async finish() {
    const miss = missingVotes();
    if (miss.length) {
      return tell('<b>Ainda não votaram todos:</b><ul>' + miss.map(m =>
        `<li>${esc(m.g.name)}: ${m.miss.length === 1 ? 'vinho ' : 'vinhos '}${listPt(m.miss.map(String))}</li>`).join('') +
        '</ul>A prova só termina quando todos votarem em todos os vinhos.');
    }
    if (!await ask('Todos votaram em todos os vinhos.<br><br>Terminar a prova e passar à revelação?', 'Terminar')) return;
    await evRef().update({ phase: 'reveal' });
  },

  async showResults() {
    const left = bottlesWithoutMajority();
    if (left.length) return tell('Ainda ninguém disse que vinho estava na garrafa ' + listPt(left.map(String)) + '.');
    if (!await ask('Mostrar os resultados a todos?', 'Mostrar')) return;
    const m = majority();
    const b = fs.batch();
    S.wines.forEach(w => {
      let n = null;
      Object.keys(m).forEach(k => { if (m[k].wid === w.id) n = +k; });
      if (w.number !== n) b.update(wineRef(w.id), { number: n });
    });
    b.update(evRef(), { phase: 'done', finishedAt: Date.now() });
    await b.commit();
  },

  async backToTasting() {
    if (!await ask('Voltar à prova? Todos poderão mudar as notas outra vez.', 'Voltar')) return;
    await evRef().update({ phase: 'tasting' });
  },

  async reopen() {
    if (!await ask('Esconder os resultados e voltar à revelação das garrafas?', 'Voltar')) return;
    await evRef().update({ phase: 'reveal' });
  },

  async leave() {
    if (DEMO) { if (await ask('Recomeçar a demonstração do início?', 'Recomeçar')) location.reload(); return; }
    if (!await ask('Sair desta prova?<br><br>Pode voltar a entrar com o mesmo código e o mesmo nome.', 'Sair')) return;
    stopEvent(); setUrl(null); S.view = 'home'; render(true);
  },

  async newTasting() {
    if (!await ask('Criar uma prova nova? Vai sair deste ecrã.', 'Criar')) return;
    stopEvent(); setUrl(null); S.view = 'create'; render(true);
  }
};

async function saveGuess(n) {
  const g = {};
  FIELDS.forEach(f => { g[f.k] = val('g_' + f.k); });
  const all = Object.assign({}, S.guesses[S.guestId] || {});
  all[n] = g; S.guesses[S.guestId] = all;
  await myRatingRef().set({ guesses: { [n]: g } }, { merge: true });
}

async function saveRevealVote(k, wineId) {
  const total = S.event.total, mine = Object.assign({}, S.reveals[S.guestId] || {}), full = {};
  for (let i = 1; i <= total; i++) {
    let v = mine[i] || '';
    if (wineId && v === wineId) v = '';   // a wine can only be in one bottle
    full[i] = i === k ? (wineId || '') : v;
  }
  S.reveals[S.guestId] = full;
  await myRatingRef().set({ reveal: full }, { merge: true });
}

// Inputs for country, region, year, abv, grapes (and the name, for guesses).
function fieldInputs(fields, prefix, values, extra) {
  const one = f => `<div><label for="${prefix + f.k}">${f.label}</label>
    <input id="${prefix + f.k}" ${extra(f)} maxlength="80" value="${esc(values[f.k] || '')}"
      ${f.list ? `list="${f.list}"` : ''} ${f.mode ? `inputmode="${f.mode}"` : ''} ${f.hint ? `placeholder="${esc(f.hint)}"` : ''} autocomplete="off"></div>`;
  let html = '', i = 0;
  while (i < fields.length) {
    if (fields[i].half && fields[i + 1] && fields[i + 1].half) { html += `<div class="grid2">${one(fields[i])}${one(fields[i + 1])}</div>`; i += 2; }
    else { html += one(fields[i]); i++; }
  }
  return html;
}

function guessCard(n) {

function tastingView(me) {
  const e = S.event, total = e.total;
  if (!S.sel || S.sel > total) S.sel = firstUnscored();
  const n = S.sel;
  const mine = myScores();
  const my = mine[n];
  const per = perScore();
  const usedElsewhere = s => Object.keys(mine).filter(k => +k !== n && mine[k] === s).length;
  const done = Object.keys(mine).filter(k => k <= total && mine[k] != null).length;

  let grid = '';
  for (let s = 0; s <= maxScore(); s++) {
    const left = per - usedElsewhere(s);
    const sel = my === s, out = left <= 0 && !sel;
    const note = sel ? '✓' : out ? 'esgotado' : (left === 1 ? 'resta 1' : 'restam ' + left);
    grid += `<button class="score${sel ? ' sel' : ''}" data-act="score" data-s="${s}" ${out ? 'disabled' : ''} aria-pressed="${sel}">
      <span class="n">${s}</span><span class="left">${note}</span></button>`;
  }

  let chips = '';
  for (let k = 1; k <= total; k++) {
    const v = mine[k];
    chips += `<button class="chip${v == null ? ' todo' : ''}${k === n ? ' active' : ''}" data-act="go" data-n="${k}">
      Vinho ${k}<b>${v == null ? '–' : v}</b></button>`;
  }

  return `${topBar(me)}
  <div class="label-wrap">
    <button class="arrow" data-act="go" data-n="${n - 1}" ${n <= 1 ? 'disabled' : ''} aria-label="Vinho anterior">‹</button>
    <div class="bottle-label"><div class="cap">Vinho</div><div class="num">${n}</div><div class="of">de ${total}</div></div>
    <button class="arrow" data-act="go" data-n="${n + 1}" ${n >= total ? 'disabled' : ''} aria-label="Vinho seguinte">›</button>
  </div>
  ${my == null ? '<p class="prompt">Toque na sua nota</p>' : `<div class="saved">Deu ${my} ao vinho ${n}</div>`}
  <div class="scores">${grid}</div>
  ${guessCard(n)}
  <div class="card">
    <h2>As suas notas (${done} de ${total})</h2>
    <p class="small">Pode votar por qualquer ordem e mudar até o anfitrião terminar.</p>
    <div class="chips">${chips}</div>
  </div>
  ${S.isHost ? hostTastingPanel() : ''}`;
}

/* --- reveal: everyone says which wine was in each bottle; the majority decides --- */
function revealView(me) {
  const total = S.event.total;
  const m = majority();
  const mine = S.reveals[S.guestId] || {};
  const voters = k => Object.keys(S.reveals).filter(gid => (S.reveals[gid] || {})[k]).length;
  const sameName = w => S.wines.some(o => o.id !== w.id && norm(o.name) === norm(w.name));
  const label = w => esc(w.name) + (sameName(w) ? ' (' + esc(broughtBy(w)) + ')' : '');

  let rows = '';
  for (let k = 1; k <= total; k++) {
    const pick = mine[k] || '';
    const opts = S.wines.map(o => {
      let at = 0; Object.keys(mine).forEach(b => { if (mine[b] === o.id && +b !== k) at = +b; });
      return `<option value="${esc(o.id)}"${pick === o.id ? ' selected' : ''}>${label(o)}${at ? ' · disse que é a ' + at : ''}</option>`;
    }).join('');
    const win = m[k] && S.wines.find(w => w.id === m[k].wid);
    rows += `<div class="reveal-row"><span class="tag-num">${k}</span><div class="rv">
      <select data-reveal="${k}" aria-label="Que vinho estava na garrafa ${k}"><option value="">Que vinho é?</option>${opts}</select>
      <span class="sub">${win ? `Maioria: <span class="majority">${label(win)}</span> (${plural(m[k].n, 'voto', 'votos')} de ${voters(k)})` : 'Ainda sem votos'}</span>
    </div></div>`;
  }
  const left = bottlesWithoutMajority();
  return `${topBar(me)}
  <div class="stage"><div class="bigicon" aria-hidden="true">🎁</div><h1>A revelação</h1>
    <p class="lead">Destapem as garrafas. Cada um diz que vinho estava em cada número; conta a maioria.</p></div>
  <div class="card">${rows}</div>
  ${S.isHost ? `<div class="card host">
      <button class="btn green" style="margin-top:0" data-act="showResults" ${left.length ? 'disabled' : ''}>Mostrar resultados a todos</button>
      <button class="textbtn" data-act="backToTasting">Voltar à prova</button></div>`
    : DEMO ? `<div class="card host">
        <button class="btn green" style="margin-top:0" data-act="showResults" ${left.length ? 'disabled' : ''}>Ver os resultados</button>
        <p class="small">Numa prova a sério, é o anfitrião que mostra os resultados a todos.</p></div>`
    : '<div class="waiting">Os resultados aparecem quando o anfitrião terminar.</div>'}`;
}

/* --- results --- */
function computeResults() {
  const rows = S.wines.filter(w => w.number).map(w => {
    const vals = Object.values(S.ratings).map(sc => sc[w.number]).filter(v => typeof v === 'number');
    const sum = vals.reduce((a, b) => a + b, 0);
    return Object.assign({}, w, { count: vals.length, avg: vals.length ? sum / vals.length : null });
  });
  rows.sort((a, b) => (b.avg == null ? -1 : b.avg) - (a.avg == null ? -1 : a.avg) || a.number - b.number);
  rows.forEach(r => { r.rank = r.avg == null ? null : 1 + rows.filter(o => o.avg != null && o.avg > r.avg + 1e-9).length; });
  return rows;
}

function guessScore(gid) {
  let right = 0, tried = 0;
  const all = S.guesses[gid] || {};
  S.wines.filter(w => w.number).forEach(w => {
    const g = all[w.number] || {};
    FIELDS.forEach(f => { const j = judge(f.k, g[f.k], w); if (j) { tried++; if (j.ok) right++; } });
  });
  return { right, tried };
}

function myGuessLines(w) {
  const g = (S.guesses[S.guestId] || {})[w.number] || {};
  const lines = FIELDS.map(f => {
    const j = judge(f.k, g[f.k], w);
    if (!j) return '';
    return `<div class="nrow"><span>${f.label}: ${esc(g[f.k])}</span><span class="${j.ok ? 'ok' : 'bad'}">${j.ok ? '✓' : '✗'}${j.note ? ' ' + j.note : ''}</span></div>`;
  }).join('');
  return lines ? `<p class="small" style="margin-top:8px"><b>O seu palpite</b></p>${lines}` : '';
}

function resultsView(me) {
  const rows = computeResults();
  const winners = rows.filter(r => r.rank === 1);
  const medal = r => ({ 1: '🥇', 2: '🥈', 3: '🥉' }[r.rank] || '');
  const mine = myScores();
  const guessers = S.guests.map(g => Object.assign({ g }, guessScore(g.id))).filter(x => x.tried).sort((a, b) => b.right - a.right);

  return `${topBar(me)}
  <h1 class="center">Resultados</h1>
  ${winners.length > 1 ? '<p class="center lead">Empate no primeiro lugar!</p>' : ''}
  ${winners.map(w => `<div class="winner reveal">

    <div class="wname">${esc(w.name)}</div>
    <div class="soft">de ${esc(broughtBy(w))}</div>

    <div class="soft">média</div>
  </div>`).join('')}
  <div class="card">
    <h2>Classificação</h2>
    <p class="small">Toque num vinho para ver mais.</p>
    ${rows.map(r => `<details class="rank"><summary>
      <div class="rk${medal(r) ? ' medal' : ''}">${medal(r) || (r.rank || '–')}</div>
      <div class="info"><b>${esc(r.name)}</b>${owns(r, S.guestId) ? '<span class="mine-tag">seu</span>' : ''}
        <span class="sub">de ${esc(broughtBy(r))} · garrafa ${r.number}</span>
        ${mine[r.number] != null ? `<span class="sub">A sua nota: <b>${mine[r.number]}</b></span>` : ''}</div>
      <div class="av">${fmt(r.avg)}</div></summary>
      <div class="more">
        ${factsLine(r) ? `<div class="facts">${esc(factsLine(r))}</div>` : ''}
        ${S.guests.map(g => { const v = (S.ratings[g.id] || {})[r.number];
          return v == null ? '' : `<div class="nrow"><span>${esc(g.name)}</span><b>${v}</b></div>`; }).join('')}
        ${myGuessLines(r)}
      </div>
    </details>`).join('')}
  </div>
  ${guessers.length ? `<div class="card"><h2>Palpites certos</h2>
    ${guessers.map(x => `<div class="nrow"><span>${esc(x.g.name)}</span><b>${x.right} de ${x.tried}</b></div>`).join('')}</div>` : ''}
  ${S.isHost ? `<button class="textbtn" data-act="reopen">Corrigir a revelação</button>
    <button class="textbtn" data-act="newTasting">Criar uma prova nova</button>`
    : DEMO ? '<button class="btn outline" data-act="leave">Experimentar outra vez</button>' : ''}`;
}

function view() {
  const ribbon = DEMO ? '<div class="ribbon">Demonstração: está numa prova a decorrer.<br>Experimente dar nota aos vinhos. Nada fica guardado.</div>' : '';
  return ribbon + screen();
}

function screen() {
  if (!fs) return '<p class="center lead" style="margin-top:40vh">Sem ligação. Verifique a internet e recarregue a página.</p>';
  if (!S.code) {
    if (DEMO) return '<p class="center lead" style="margin-top:30vh">A preparar a demonstração…</p>';
    if (S.view === 'join') return joinView();
    if (S.view === 'create' && S.canCreate) return createView();
    if (S.view === 'hostLogin' && S.canCreate) return hostLoginView();
    return homeView();
  }
  if (!S.event || !S.guestsLoaded) return '<p class="center lead" style="margin-top:40vh">A carregar a prova…</p>';
  const me = S.guests.find(g => g.id === S.guestId);
  if (!me) return '<p class="center lead" style="margin-top:40vh">A carregar…</p>';
  const ph = S.event.phase;
  if (ph === 'prep') return prepView(me);
  if (ph === 'tasting') return tastingView(me);
  if (ph === 'reveal') return revealView(me);
  if (ph === 'done') return resultsView(me);
  return setupView(me);
}

/* ---------- rendering ---------- */
// Typed-in fields (marked data-keep) and the "who brought it" choices survive live redraws.
function captureDraft() {
  const d = { fields: {} };
  $app.querySelectorAll('[data-keep]').forEach(el => { if (el.id) d.fields[el.id] = el.value; });
  const p = document.getElementById('newOwners');
  if (p) d.owners = Array.from(p.querySelectorAll('.pill.on')).map(b => b.dataset.gid);
  return d;
}
function restoreDraft(d) {
  Object.keys(d.fields).forEach(id => { const el = document.getElementById(id); if (el && el.hasAttribute('data-keep')) el.value = d.fields[id]; });
  const p = document.getElementById('newOwners');
  if (p && d.owners) p.querySelectorAll('.pill').forEach(b => {
    const on = d.owners.indexOf(b.dataset.gid) >= 0;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
}

function render(force) {
  const ae = document.activeElement;
  // Don't wipe what someone is typing; redraw once they leave the box.
  if (!force && ae && $app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) {
    if (!S.pending) {
      S.pending = true;
      ae.addEventListener('blur', () => setTimeout(() => { if (S.pending) { S.pending = false; render(); } }, 350), { once: true });
    }
    return;
  }
  S.pending = false;
  if (force && ae && ae.blur && $app.contains(ae)) ae.blur();
  const key = S.code ? 'ev:' + S.code + ':' + (S.event ? S.event.phase : '') : 'v:' + S.view;
  const draft = key === S.lastKey && !S.clearDraft ? captureDraft() : null;
  S.lastKey = key; S.clearDraft = false;
  $app.innerHTML = view();
  if (draft) restoreDraft(draft);
  const qr = document.getElementById('qr');
  if (qr && window.QRCode) {
    new QRCode(qr, { text: location.origin + location.pathname + '?e=' + S.code, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  }
  syncWakeLock();
}

let busy = false;
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');

/* ---------- demo: everything lives in this phone's memory, with three virtual guests ---------- */
function memoryDb(onChange) {
  const store = new Map(), listeners = new Set();
  const clone = o => o == null ? null : JSON.parse(JSON.stringify(o));
  const merge = (a, b) => {
    const r = Object.assign({}, a);
    Object.keys(b).forEach(k => { r[k] = b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && r[k] && typeof r[k] === 'object' ? merge(r[k], b[k]) : b[k]; });
    return r;
  };
  const kids = p => Array.from(store.keys()).filter(k => k.indexOf(p + '/') === 0 && k.slice(p.length + 1).indexOf('/') < 0);
  let queued = false;
  const changed = () => {
    if (queued) return; queued = true;
    setTimeout(() => { queued = false; listeners.forEach(l => l()); if (onChange) onChange(); }, 0);
  };
  const apply = o => {
    if (o.t === 'set') store.set(o.p, o.merge && store.has(o.p) ? merge(store.get(o.p), clone(o.d)) : clone(o.d));
    else if (o.t === 'update') { if (!store.has(o.p)) throw new Error('not found: ' + o.p); store.set(o.p, Object.assign({}, store.get(o.p), clone(o.d))); }
    else store.delete(o.p);
  };
  const write = ops => { try { ops.forEach(apply); } catch (e) { return Promise.reject(e); } changed(); return Promise.resolve(); };
  const snap = p => ({ id: p.split('/').pop(), exists: store.has(p), data: () => clone(store.get(p)) });
  const watch = (read, cb) => {
    let last;
    const l = () => { const s = JSON.stringify(read()); if (s !== last) { last = s; cb(); } };
    listeners.add(l); setTimeout(l, 0);
    return () => listeners.delete(l);
  };
  function doc(p) {
    return {
      id: p.split('/').pop(), path: p,
      collection: n => col(p + '/' + n),
      get: () => Promise.resolve(snap(p)),
      set: (d, o) => write([{ t: 'set', p, d, merge: !!(o && o.merge) }]),
      update: d => write([{ t: 'update', p, d }]),
      delete: () => write([{ t: 'delete', p }]),
      onSnapshot: cb => watch(() => store.get(p) || null, () => cb(snap(p)))
    };
  }
  function col(p) {
    const c = {
      doc: id => doc(p + '/' + (id || Math.random().toString(36).slice(2, 12))),
      add: d => { const r = c.doc(); return r.set(d).then(() => r); },
      get: () => Promise.resolve({ docs: kids(p).map(snap) }),
      onSnapshot: cb => watch(() => kids(p).map(k => [k, store.get(k)]), () => cb({ docs: kids(p).map(snap) }))
    };
    return c;
  }
  return {
    collection: n => col(n),
    batch() {
      const ops = [];
      return {
        set(r, d, o) { ops.push({ t: 'set', p: r.path, d, merge: !!(o && o.merge) }); },
        update(r, d) { ops.push({ t: 'update', p: r.path, d }); },
        delete(r) { ops.push({ t: 'delete', p: r.path }); },
        commit: () => write(ops)
      };
    }
  };
}

    { name: 'Dão Colheita', owners: ['Teresa'], country: 'Portugal', region: 'Dão', year: '2018', abv: '13,5', grapes: 'Touriga Nacional, Alfrocheiro' },
    { name: 'Bairrada Baga', owners: ['Manuel'], country: 'Portugal', region: 'Bairrada', year: '2017', abv: '13', grapes: 'Baga' },
    { name: 'Alvarinho', owners: ['Ana', 'Rui'], country: 'Portugal', region: 'Vinho Verde', year: '2023', abv: '12,5', grapes: 'Alvarinho' }
  ],
  ids: {}, bottles: {}, finished: false, revealed: false,

  async start() {
    fs = memoryDb(() => Demo.tick());
    Demo.finished = Demo.revealed = false;
    const ev = fs.collection('events').doc('DEMO');
    const names = [Demo.host].concat(Demo.people, [Demo.me]), ids = Demo.ids = {};
    names.forEach(n => { ids[n] = ev.collection('guests').doc().id; });
    const total = Demo.wines.length;
    let t = Date.now();
    await ev.set({ createdAt: t, hostPin: '', hostGuest: ids[Demo.host], phase: 'tasting', current: 0, total, maxScore: MAX_SCORE, perScore: PER_SCORE });
    for (const n of names) await ev.collection('guests').doc(ids[n]).set({ name: n, joinedAt: t++ });
    // The bottles were shuffled and numbered by hand; only the virtual people know which is which.
    const order = shuffle(Demo.wines.map((w, i) => i));
    Demo.bottles = {};
    for (let i = 0; i < total; i++) {
      const w = Demo.wines[i], gids = w.owners.map(o => ids[o]), ref = ev.collection('wines').doc();
      await ref.set({ name: w.name, country: w.country, region: w.region, year: w.year, abv: w.abv, grapes: w.grapes,
        guestId: gids[0], guestIds: gids, number: null, createdAt: t++ });
      Demo.bottles[order.indexOf(i) + 1] = Object.assign({ id: ref.id }, w);
    }
    for (const n of [Demo.host].concat(Demo.people)) await ev.collection('ratings').doc(ids[n]).set(Demo.ballot(total));
    enterEvent('DEMO', ids[Demo.me], null);
  },

  // Scores (each at most twice) and guesses, some right and some wrong.
  ballot(total) {
    const pool = shuffle([3, 4, 5, 6, 7, 8, 9, 10].flatMap(x => [x, x])).concat(shuffle([0, 1, 2, 0, 1, 2]));
    const pick = (real, list, p) => Math.random() < p ? real : list[Math.floor(Math.random() * list.length)];
    const scores = {}, guesses = {};
    for (let k = 1; k <= total; k++) {
      const w = Demo.bottles[k];
      scores[k] = pool[k - 1];
      guesses[k] = {
        name: '', country: pick(w.country, ['Portugal', 'Espanha', 'França'], 0.8),
        region: pick(w.region, ['Douro', 'Alentejo', 'Dão', 'Bairrada', 'Lisboa'], 0.4),
        year: String(parseInt(w.year, 10) + (Math.random() < 0.4 ? 0 : 1)),
        abv: pick(w.abv, ['12,5', '13', '14'], 0.5), grapes: pick(w.grapes, ['Touriga Nacional', 'Baga', 'Castelão', 'Aragonez'], 0.5)
      };
    }
    return { scores, guesses };
  },

  // Once the visitor has scored every wine, the virtual host ends the tasting; at the reveal the others vote.
  tick() {
    const e = S.event;
    if (!e) return;
    if (e.phase === 'tasting' && !Demo.finished) {
      const mine = myScores();
      for (let k = 1; k <= e.total; k++) if (mine[k] == null) return;
      Demo.finished = true;
      toast('Votou em todos os vinhos! O anfitrião vai terminar a prova.', 'ok');
      setTimeout(() => fs.collection('events').doc('DEMO').update({ phase: 'reveal' }), 3500);
    }
    if (e.phase === 'reveal' && !Demo.revealed) {
      Demo.revealed = true;
      setTimeout(async () => {
        const voters = [Demo.host].concat(Demo.people);
        for (let i = 0; i < voters.length; i++) {
          const map = {};
          for (let k = 1; k <= e.total; k++) map[k] = Demo.bottles[k].id;
          if (voters[i] === 'Teresa') { const x = map[1]; map[1] = map[2]; map[2] = x; } // one mix-up; the majority fixes it
          await fs.collection('events').doc('DEMO').collection('ratings').doc(Demo.ids[voters[i]]).set({ reveal: map }, { merge: true });
        }
      }, 1500);
    }
  }
};

/* ---------- start ---------- */
/* Phones and GitHub keep old copies of this page for a while. version.txt is always fetched fresh; if it names
   a newer version than this page, reload once with ?v=<version>, an address no cache has seen yet. */
async function isOutdated() {
  try {
    const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return false;
    const latest = (await r.text()).trim();
    if (!latest || latest === APP_VERSION || PARAMS.get('v') === latest) return false;
    PARAMS.set('v', latest);
    location.replace(location.pathname + '?' + PARAMS.toString());
    return true;
  } catch (e) { return false; }
}

(async function init() {
  if (await isOutdated()) return;
  if (DEMO) { await Demo.start(); return; }
  if (!window.firebase) { render(true); return; }
  firebase.initializeApp(firebaseConfig);
  fs = firebase.firestore();
  // Some routers, mobile networks and antivirus proxies hold back Firestore's streaming connection,
  // so live updates never arrive. Long polling works everywhere and is plenty fast for a dinner table.
  fs.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false, merge: true });

  // Only the host link (?anfitriao=<secret>) can create tastings. The plain link only joins one with a code.
  const key = PARAMS.get('anfitriao');
  try { if (key && await sha256(key) === HOST_HASH) { S.hostKey = key; S.canCreate = true; } } catch (e) {}

  // Reopen this phone's tasting only when the address names it (a reload, or the QR code again).
  // The plain link always starts on the home screen.
  const urlCode = (PARAMS.get('e') || '').toUpperCase().replace(/[^A-Z]/g, '');
  const saved = loadSession();
  if (urlCode.length === 4 && saved && saved.code === urlCode && saved.guestId) {
    S.code = saved.code; S.guestId = saved.guestId; S.hostPin = saved.hostPin || null;
    setUrl(S.code); subscribe(); render(true);
  } else if (urlCode.length === 4) {
    S.joinCode = urlCode; S.view = 'join'; setUrl(urlCode); render(true);
  } else {
    setUrl(null); render(true);
  }
})();
</script>
